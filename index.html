<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111111"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><title>Training</title></head><body>
<header><div><small>OFFLINE TRAINING</small><h1 id="title">Heute</h1></div><button id="installBtn" class="ghost" hidden>Installieren</button></header>
<nav><button data-view="today" class="active">Heute</button><button data-view="week">Woche</button><button data-view="history">Verlauf</button><button data-view="data">Daten</button></nav>
<main>
<section id="today" class="view active"><div class="card hero"><div><span id="dayLabel" class="pill"></span><h2 id="focus"></h2><p id="summary"></p></div><button id="startGuided" class="primary">Training starten</button></div><div id="exerciseList"></div></section>
<section id="week" class="view"><div class="card"><h2>Wochenplan</h2><div id="weekList"></div></div></section>
<section id="history" class="view"><div class="card"><h2>Verlauf</h2><div id="historyList"></div></div></section>
<section id="data" class="view"><div class="card"><h2>Daten & Backup</h2><p>Exportiere deinen Trainingsverlauf für die Auswertung in ChatGPT oder als Backup.</p><button id="exportBtn" class="primary">Daten exportieren</button><label class="fileBtn">Daten importieren<input id="importFile" type="file" accept="application/json"></label><button id="resetBtn" class="danger">Lokale Daten löschen</button></div></section>
</main>
<div id="guided" class="modal hidden"><div class="modalCard"><div class="modalTop"><button id="closeGuided" class="ghost">← Liste</button><span id="progress"></span></div><span id="gStatus" class="pill"></span><h2 id="gName"></h2><p id="gTarget"></p><p id="gAlt" class="muted"></p><div id="sets"></div><div class="fieldRow"><label>Belastung<select id="effort"><option value="">–</option><option>leicht</option><option>passend</option><option>schwer</option><option>sehr schwer</option></select></label><label>Schmerz 0–10<input id="pain" type="number" min="0" max="10" inputmode="numeric"></label></div><label>Notiz<textarea id="note" rows="2" placeholder="z. B. LWS zieht ab Satz 3"></textarea></label><div class="actions"><button id="occupied" class="secondary">Gerät belegt</button><button id="done" class="primary">Übung erledigt</button></div><button id="chooseExercise" class="ghost wide">Andere offene Übung wählen</button></div></div>
<script src="app.js"></script></body></html>
